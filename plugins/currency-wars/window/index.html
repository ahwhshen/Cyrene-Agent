<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>货币战争控制台</title>
<style>
  /* 插件窗口自带样式：颜色一律走 CSS 变量，随系统深浅色自适应（接口规范 §11）。 */
  :root {
    --bg: #f6f2fa;
    --panel: rgba(255, 255, 255, 0.72);
    --border: rgba(120, 90, 160, 0.18);
    --text-strong: #2c2438;
    --text-default: #4a4158;
    --text-muted: #837a94;
    --accent: #a06cd5;
    --accent-soft: rgba(160, 108, 213, 0.14);
    --ok: #2e9e6b;
    --err: #c0504d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17141d;
      --panel: rgba(38, 32, 48, 0.72);
      --border: rgba(255, 255, 255, 0.10);
      --text-strong: #f1ecf8;
      --text-default: #d6cfe2;
      --text-muted: #8f87a0;
      --accent: #c29ae8;
      --accent-soft: rgba(194, 154, 232, 0.16);
      --ok: #58c892;
      --err: #e08a87;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 18px;
    font-family: "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    color: var(--text-default);
    background: var(--bg);
    display: flex; flex-direction: column; gap: 14px;
    min-height: 100vh;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    padding: 3px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--border); font-size: 12px;
  }
  .badge.ok { color: var(--ok); }
  .badge.err { color: var(--err); }
  button {
    padding: 7px 18px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel); color: var(--text-strong);
    transition: transform .08s ease, background .15s ease;
  }
  button:hover:not(:disabled) { background: var(--accent-soft); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 14px;
  }
  .panel h3 { margin: 0 0 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: .04em; }
  #progress-bar { height: 8px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
  #progress-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
  #progress-text { margin-top: 6px; font-size: 12px; color: var(--text-muted); }
  #log {
    flex: 1; min-height: 180px; overflow-y: auto;
    font-family: Consolas, monospace; font-size: 12px; line-height: 1.7;
    white-space: pre-wrap; color: var(--text-default);
  }
  .hint { color: var(--text-muted); font-size: 12px; }
</style>
</head>
<body>
  <div class="row">
    <strong style="color: var(--text-strong); font-size: 15px;">货币战争控制台</strong>
    <span id="status-badge" class="badge">待机</span>
    <span style="flex: 1;"></span>
    <button id="start-btn" class="primary">▶ 启动</button>
    <button id="stop-btn" disabled>⏹ 停止</button>
    <button id="test-ocr-btn">🔍 识别测试</button>
  </div>

  <div class="panel">
    <h3>进度</h3>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-text">尚未运行</div>
  </div>

  <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
    <h3>日志</h3>
    <div id="log"></div>
  </div>

  <div class="hint">配置项在 设置 → 插件 → 星穹铁道·货币战争 中修改；VLM 识别器沿用游戏代肝的共享配置。</div>

<script>
  const bridge = window.cyrenePlugin;
  const badge = document.getElementById("status-badge");
  const startBtn = document.getElementById("start-btn");
  const stopBtn = document.getElementById("stop-btn");
  const testBtn = document.getElementById("test-ocr-btn");
  const fill = document.getElementById("progress-fill");
  const progressText = document.getElementById("progress-text");
  const logEl = document.getElementById("log");
  let lastLogLen = -1;

  function renderState(state) {
    if (!state) return;
    startBtn.disabled = state.running;
    stopBtn.disabled = !state.running;
    if (state.running) {
      badge.textContent = "运行中";
      badge.className = "badge ok";
    } else if (state.lastResult && state.lastResult.ok === false) {
      badge.textContent = "已结束（失败）";
      badge.className = "badge err";
    } else if (state.lastResult) {
      badge.textContent = "已完成";
      badge.className = "badge ok";
    } else {
      badge.textContent = "待机";
      badge.className = "badge";
    }
    const p = state.progress || { index: 0, total: 0, desc: "" };
    if (p.total > 0 && p.index >= 0) {
      fill.style.width = Math.min(100, Math.round(((p.index + 1) / p.total) * 100)) + "%";
      progressText.textContent = `${p.desc}（${p.index + 1}/${p.total}）`;
    } else if (p.desc) {
      progressText.textContent = p.desc;
    }
    // 日志增量渲染
    const logs = state.log || [];
    if (logs.length !== lastLogLen) {
      logEl.textContent = logs.join("\n");
      lastLogLen = logs.length;
    }
  }

  async function poll() {
    try {
      const raw = await bridge.callTool("currency_wars_status");
      renderState(JSON.parse(raw));
    } catch { /* 插件被禁用时静默 */ }
  }

  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    const result = await bridge.callTool("currency_wars_start");
    progressText.textContent = result;
    await poll();
  });
  stopBtn.addEventListener("click", async () => {
    const result = await bridge.callTool("currency_wars_stop");
    progressText.textContent = result;
    await poll();
  });
  testBtn.addEventListener("click", async () => {
    testBtn.disabled = true;
    progressText.textContent = "识别测试中…";
    const result = await bridge.callTool("currency_wars_test_ocr");
    progressText.textContent = result.length > 200 ? result.slice(0, 200) + "…" : result;
    logEl.textContent = result + "\n" + logEl.textContent;
    testBtn.disabled = false;
  });

  // 设置页改了配置 → 提示一下（具体生效在下次启动）
  bridge.onSettingsChange(() => {
    progressText.textContent = "配置已更新，将在下次启动时生效";
  });

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
